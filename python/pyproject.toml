[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-tls"
version = "0.1.0"
description = "HTTP client with real browser and app TLS / HTTP/2 fingerprints"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["spark_tls"]

[tool.setuptools.package-data]
spark_tls = ["lib/*"]
